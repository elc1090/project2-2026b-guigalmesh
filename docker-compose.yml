
services:
  db:
    image: postgres:16-alpine
    container_name: carteira_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carteira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carteira}
      POSTGRES_DB: ${POSTGRES_DB:-carteira_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carteira}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: carteira_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carteira}:${POSTGRES_PASSWORD:-carteira}@db:5432/${POSTGRES_DB:-carteira_db}
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: carteira_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
